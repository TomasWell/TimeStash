name: TimeStash
options:
  bundleIdPrefix: com.junxf
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true
  createIntermediateGroups: true

packages:
  GRDB:
    url: https://github.com/groue/GRDB.swift
    from: "7.0.0"

settings:
  base:
    DEVELOPMENT_TEAM: QLJ5YWNC2W
    CODE_SIGN_STYLE: Manual
    SWIFT_VERSION: "6.0"

schemes:
  TimeStash:
    build:
      targets:
        TimeStash: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - TimeStashTests
        - TimeStashUITests

targets:
  TimeStash:
    type: application
    platform: iOS
    sources:
      - path: TimeStash
        # ⚠️ 必须排除 .i18n-progress.json（2026-10-24 实测）。
        # 翻译流水线的进度文件放在 i18n 目录里，xcodegen 扫目录会把它
        # 当资源打进 App 包（私密记账实测产物里确实有这个 json）。
        # resources 段的 excludes 只挡资源拷贝，挡不住 sources 扫描 ——
        # 两处都要排除。
        excludes:
          - "i18n/.i18n-progress.json"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.junxf.timestash
        CODE_SIGN_STYLE: Manual
        MARKETING_VERSION: "1.0"
        # build 6 = build 5 + 本档的 i18n 补键 + 设置页语言选择器 + 两条守卫。
        # ⚠️ marketing version 沿用 1.0.1（**不**升 1.0.2）：1.0.1 的 build 5
        # 已上传但版本槽还没建，本档的改动应该跟它一起进 1.0.1 那一次提审，
        # 而不是白白多占一个小版本号（一个 App 每周最多一个小版本号）。
        # 仓库既有先例：build 3/4/5 共用 marketing 1.0.1，只递增 build 号。
        # build 8 = build 7 + App Shortcuts（长按图标快捷菜单）+ UI 守卫
        # ⚠️ build 7 已于 2026-11-06 上传并挂在 1.0 槽审核中 → 下一个可用号是 8
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_CFBundleDisplayName: TimeStash
        DEVELOPMENT_LANGUAGE: zh-Hans
        SWIFT_EMIT_LOC_STRINGS: "YES"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: "YES"
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait"
        INFOPLIST_KEY_UIBackgroundModes: ""
        CODE_SIGN_ENTITLEMENTS: TimeStash/TimeStash.entitlements
        PROVISIONING_PROFILE_SPECIFIER: TimeStash Distribution v5
        CODE_SIGN_IDENTITY: "Apple Distribution"
        OTHER_CODE_SIGN_FLAGS: --timestamp --options runtime
    entitlements:
      path: TimeStash/TimeStash.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.junxf.timestash
    info:
      path: TimeStash/Info.plist
      properties:
        # ⚠️ CFBundleLocalizations **必须写在这里**（info.properties），
        # **不能用 INFOPLIST_KEY_ 前缀** —— 该前缀不生成这个键
        # （2026-10-25 夜间第 2 档在卡点通勤实测确认，2026-10-28 复核仍成立）。
        # 作用：告诉系统「这个 App 支持这些语言」→ iOS「设置 → App → 语言」
        # 才会列出全部语言，而不是只列 CFBundleDevelopmentRegion(zh-Hans) 一个。
        # 少了这个键，50 个 .lproj 打进包里也没用 —— 用户在系统里根本找不到
        # 自己那 49 种语言（App 内设置页的切换器救不了「系统里搜不到这个 App」）。
        # 2026-10-28 实测：卡点通勤 10-27 已修（commit d804f48），
        # 私密记账同款本档已修，但 TimeStash / DataMe 都还缺。
        CFBundleLocalizations:
          - ar
          - bg
          - bn
          - cs
          - da
          - de
          - el
          - en
          - es
          - et
          - fi
          - fil
          - fr
          - gu
          - he
          - hi
          - hr
          - hu
          - id
          - is
          - it
          - ja
          - kn
          - ko
          - lt
          - lv
          - ml
          - mr
          - ms
          - nb
          - nl
          - pa
          - pl
          - pt-BR
          - pt-PT
          - ro
          - ru
          - sk
          - sl
          - sr
          - sv
          - ta
          - te
          - th
          - tr
          - uk
          - ur
          - vi
          - zh-Hans
          - zh-Hant
    dependencies:
      - package: GRDB
        product: GRDB
      - target: TimeStashWidget
        embed: true
    resources:
      - path: TimeStash/i18n
        buildPhase: resources

  TimeStashWidget:
    type: app-extension
    platform: iOS
    sources:
      - TimeStashWidget
      - path: TimeStash/domain
        buildPhase: sources
      - path: TimeStash/data
        buildPhase: sources
      # ⚠️ util **不能整目录进 Widget**：VaultNotifier 用了
      #    UNUserNotificationCenter（App Extension 里不可用，编译直接报错），
      #    VaultStore / DemoSeed 是 App 独有的。Widget 只需要查表的 L()。
      - path: TimeStash/util/Localization.swift
        buildPhase: sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.junxf.timestash.widget
        CODE_SIGN_STYLE: Manual
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: "YES"
        DEVELOPMENT_LANGUAGE: zh-Hans
        SWIFT_EMIT_LOC_STRINGS: "YES"
        INFOPLIST_KEY_NSExtension: ""
        CODE_SIGN_ENTITLEMENTS: TimeStashWidget/TimeStashWidget.entitlements
        PROVISIONING_PROFILE_SPECIFIER: TimeStashWidget Distribution v3
        CODE_SIGN_IDENTITY: "Apple Distribution"
        OTHER_CODE_SIGN_FLAGS: --timestamp --options runtime
    entitlements:
      path: TimeStashWidget/TimeStashWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.junxf.timestash
    info:
      path: TimeStashWidget/Info.plist
      properties:
        CFBundleDisplayName: TimeStash Widget
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    dependencies:
      - package: GRDB
        product: GRDB
    resources:
      - path: TimeStashWidget/i18n
        buildPhase: resources

  TimeStashTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - TimeStashTests
    dependencies:
      - target: TimeStash
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.junxf.timestash.tests
        GENERATE_INFOPLIST_FILE: "YES"

  # UITest target：只用于生成 Apple Guideline 2.1 要求的 App 演示录像
  # （XCUITest 精确驱动元素，比模拟器窗口坐标点击可靠）。
  # 不参与 App 产物，不影响上架。
  TimeStashUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - TimeStashUITests
    dependencies:
      - target: TimeStash
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.junxf.timestash.uitests
        GENERATE_INFOPLIST_FILE: "YES"
        TEST_TARGET_NAME: TimeStash
