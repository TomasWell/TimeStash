name: TimeStash
options:
  bundleIdPrefix: com.junxf
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true
  createIntermediateGroups: true

packages:
  GRDB:
    url: https://github.com/groue/GRDB.swift
    from: "7.0.0"

settings:
  base:
    DEVELOPMENT_TEAM: QLJ5YWNC2W
    CODE_SIGN_STYLE: Manual
    SWIFT_VERSION: "6.0"

schemes:
  TimeStash:
    build:
      targets:
        TimeStash: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - TimeStashTests
        - TimeStashUITests

targets:
  TimeStash:
    type: application
    platform: iOS
    sources:
      - path: TimeStash
        # ⚠️ 必须排除 .i18n-progress.json（2026-10-24 实测）。
        # 翻译流水线的进度文件放在 i18n 目录里，xcodegen 扫目录会把它
        # 当资源打进 App 包（私密记账实测产物里确实有这个 json）。
        # resources 段的 excludes 只挡资源拷贝，挡不住 sources 扫描 ——
        # 两处都要排除。
        excludes:
          - "i18n/.i18n-progress.json"
          # ⚠️ 2026-11-16 P0：翻译 ca/or 时用了另一个进度文件名
          #   （.i18n-progress-caor.json），原 excludes 只挡了固定那一个
          #   → 新的进度文件会被**打进 App 包**（.json 是资源）。
          # ⇒ 改成通配，挡掉所有 .i18n-progress*.json。
          - "i18n/.i18n-progress*.json"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.junxf.timestash
        CODE_SIGN_STYLE: Manual
        MARKETING_VERSION: "1.0"
        # build 12 = 11-14 的 i18n 修复（33 处界面直接显示本地化 key），
        # 2026-11-15 21:01 提交审核后被 Apple 拒审（state=UNRESOLVED_ISSUES）。
        #
        # build 13 = build 12 + 2026-11-16 P0 拒审修复：
        #   ① 筛选菜单 `Button("category_\(rawValue)")` 运行时拼 key
        #      → 所有语言下显示 `category_work` 原文（LedgerView.swift:56）
        #   ② 守卫扩面：只扫 Text 不扫 Button/Label + 新增「运行时拼 key」守卫
        #   ③ DemoSeed 的 20 条任务名改走本地化键（原为中文硬编码）
        #      → 一份种子数据能出 48 个语言的商店页（2.3.3）
        #   ④ 截图模式跳过系统通知授权弹窗（原会盖住整个计时界面，2.3.3）
        #   ⑤ run_tests.sh 用例数口径修正（swift-testing + XCTest 相加）
        #
        # build 14 = build 13 + 2026-11-16 P0 补漏：
        #   ① **补 ca.lproj / or.lproj 两个界面语言**（各 110 键全译）
        #      —— ASC 有 48 个商店页，其中 ca（加泰罗尼亚语）和 or-IN（奥里亚语）
        #      **两个 locale 在 App 里根本没有对应 .lproj** → 那两个商店页
        #      无论截什么图都只能拍到别的语言 → 违反 2.3.3。
        #      现在补上 → App 界面语言 52 个，覆盖 ASC 全部 48 个商店页。
        #   ② CFBundleLocalizations 补 ca / or（否则系统「设置→App→语言」列不出）
        #   ③ project.yml 排除进度文件改成通配（.i18n-progress*.json）
        # ⚠️ marketing version 沿用 1.0（**不**升 1.0.1）：被拒后原地重提，
        #    Apple 同一时间只有一个可编辑版本槽，且实测 verId 不变。
        CURRENT_PROJECT_VERSION: "14"
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_CFBundleDisplayName: TimeStash
        DEVELOPMENT_LANGUAGE: zh-Hans
        SWIFT_EMIT_LOC_STRINGS: "YES"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: "YES"
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait"
        INFOPLIST_KEY_UIBackgroundModes: ""
        CODE_SIGN_ENTITLEMENTS: TimeStash/TimeStash.entitlements
        # 门户 v4：2026-11-08 门户建 App ID + 关联 App Group 后由 ASC API 生成，
        # 已核验 entitlements 含 com.apple.security.application-groups =
        # group.com.junxf.timestash（v1/v2/v3 的 app-groups 数组是空的，别用）。
        PROVISIONING_PROFILE_SPECIFIER: TimeStash Distribution v4
        CODE_SIGN_IDENTITY: "Apple Distribution"
        OTHER_CODE_SIGN_FLAGS: --timestamp --options runtime
    entitlements:
      path: TimeStash/TimeStash.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.junxf.timestash
    info:
      path: TimeStash/Info.plist
      properties:
        # ⚠️ CFBundleLocalizations **必须写在这里**（info.properties），
        # **不能用 INFOPLIST_KEY_ 前缀** —— 该前缀不生成这个键
        # （2026-10-25 夜间第 2 档在卡点通勤实测确认，2026-10-28 复核仍成立）。
        # 作用：告诉系统「这个 App 支持这些语言」→ iOS「设置 → App → 语言」
        # 才会列出全部语言，而不是只列 CFBundleDevelopmentRegion(zh-Hans) 一个。
        # 少了这个键，50 个 .lproj 打进包里也没用 —— 用户在系统里根本找不到
        # 自己那 49 种语言（App 内设置页的切换器救不了「系统里搜不到这个 App」）。
        # 2026-10-28 实测：卡点通勤 10-27 已修（commit d804f48），
        # 私密记账同款本档已修，但 TimeStash / DataMe 都还缺。
        CFBundleLocalizations:
          - ar
          - bg
          - bn
          - ca
          - cs
          - da
          - de
          - el
          - en
          - es
          - et
          - fi
          - fil
          - fr
          - gu
          - he
          - hi
          - hr
          - hu
          - id
          - is
          - it
          - ja
          - kn
          - ko
          - lt
          - lv
          - ml
          - mr
          - ms
          - nb
          - nl
          - or
          - pa
          - pl
          - pt-BR
          - pt-PT
          - ro
          - ru
          - sk
          - sl
          - sr
          - sv
          - ta
          - te
          - th
          - tr
          - uk
          - ur
          - vi
          - zh-Hans
          - zh-Hant
    dependencies:
      - package: GRDB
        product: GRDB
      - target: TimeStashWidget
        embed: true
    resources:
      - path: TimeStash/i18n
        buildPhase: resources
        # ⚠️ 2026-11-16 P0：resources 段也要排除进度文件
        #   （sources 段的 excludes 只挡目录扫描，挡不住资源拷贝）。
        excludes:
          - ".i18n-progress*.json"

  TimeStashWidget:
    type: app-extension
    platform: iOS
    sources:
      - TimeStashWidget
      - path: TimeStash/domain
        buildPhase: sources
      - path: TimeStash/data
        buildPhase: sources
      # ⚠️ util **不能整目录进 Widget**：VaultNotifier 用了
      #    UNUserNotificationCenter（App Extension 里不可用，编译直接报错），
      #    VaultStore / DemoSeed 是 App 独有的。Widget 只需要查表的 L()。
      - path: TimeStash/util/Localization.swift
        buildPhase: sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.junxf.timestash.widget
        CODE_SIGN_STYLE: Manual
        MARKETING_VERSION: "1.0"
        # ⚠️ 扩展包版本号必须与主 App 一致（否则上传报 90345 版本不一致）
        # ⚠️ 2026-11-16 P0：主 App 升到 14 后，**这里也要一起升** ——
        #    只改主 App 会导致 90345 版本不一致 → 上传必失败。
        CURRENT_PROJECT_VERSION: "14"
        GENERATE_INFOPLIST_FILE: "YES"
        DEVELOPMENT_LANGUAGE: zh-Hans
        SWIFT_EMIT_LOC_STRINGS: "YES"
        INFOPLIST_KEY_NSExtension: ""
        CODE_SIGN_ENTITLEMENTS: TimeStashWidget/TimeStashWidget.entitlements
        PROVISIONING_PROFILE_SPECIFIER: TimeStashWidget Distribution v4
        CODE_SIGN_IDENTITY: "Apple Distribution"
        OTHER_CODE_SIGN_FLAGS: --timestamp --options runtime
    entitlements:
      path: TimeStashWidget/TimeStashWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.junxf.timestash
    info:
      path: TimeStashWidget/Info.plist
      properties:
        CFBundleDisplayName: TimeStash Widget
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    dependencies:
      - package: GRDB
        product: GRDB
    resources:
      - path: TimeStashWidget/i18n
        buildPhase: resources

  TimeStashTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - TimeStashTests
    dependencies:
      - target: TimeStash
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.junxf.timestash.tests
        GENERATE_INFOPLIST_FILE: "YES"

  # UITest target：只用于生成 Apple Guideline 2.1 要求的 App 演示录像
  # （XCUITest 精确驱动元素，比模拟器窗口坐标点击可靠）。
  # 不参与 App 产物，不影响上架。
  TimeStashUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - TimeStashUITests
    dependencies:
      - target: TimeStash
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.junxf.timestash.uitests
        GENERATE_INFOPLIST_FILE: "YES"
        TEST_TARGET_NAME: TimeStash
